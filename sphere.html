<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sphere</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Sphere. Drag to throw."></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const COLOR = "#CCFF00";
const SHADE = "#A8D400";
let w = 1, h = 1, dpr = 1;
const balls = [];
let drag = null;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function spawn(x, y, r) {
  balls.push({ x, y, r, vx: (Math.random() - 0.5) * 3, vy: -1 });
}
spawn(w * 0.5, h * 0.42, Math.min(w, h) * 0.16);

function pointer(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener("pointerdown", e => {
  const p = pointer(e);
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    const dx = p.x - b.x, dy = p.y - b.y;
    if (dx * dx + dy * dy <= b.r * b.r) {
      drag = { b, lx: p.x, ly: p.y };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
  }
});
canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = pointer(e);
  drag.b.vx = (p.x - drag.lx) * 0.85;
  drag.b.vy = (p.y - drag.ly) * 0.85;
  drag.b.x = p.x;
  drag.b.y = p.y;
  drag.lx = p.x;
  drag.ly = p.y;
});
function endDrag() { drag = null; }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("dblclick", e => {
  const p = pointer(e);
  spawn(p.x, p.y, 18 + Math.random() * 22);
});

function step() {
  ctx.clearRect(0, 0, w, h);
  for (const b of balls) {
    if (drag && drag.b === b) continue;
    b.vy += 0.18;
    b.x += b.vx;
    b.y += b.vy;
    if (b.y + b.r > h) { b.y = h - b.r; b.vy *= -0.86; b.vx *= 0.98; }
    if (b.y - b.r < 0) { b.y = b.r; b.vy *= -0.86; }
    if (b.x + b.r > w) { b.x = w - b.r; b.vx *= -0.86; }
    if (b.x - b.r < 0) { b.x = b.r; b.vx *= -0.86; }
  }
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.01;
      const min = a.r + b.r;
      if (dist < min) {
        const nx = dx / dist, ny = dy / dist, overlap = min - dist;
        a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
        const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel > 0) {
          a.vx -= rel * nx; a.vy -= rel * ny;
          b.vx += rel * nx; b.vy += rel * ny;
        }
      }
    }
  }
  for (const b of balls) {
    ctx.fillStyle = COLOR;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = SHADE;
    ctx.beginPath();
    ctx.arc(b.x + b.r * 0.18, b.y + b.r * 0.22, b.r * 0.72, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLOR;
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.08, b.y - b.r * 0.1, b.r * 0.62, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
